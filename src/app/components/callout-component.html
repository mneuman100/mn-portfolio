            <svg xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 64 64"

                <path d="M28 42h8"/>
                <path d="M24 50h16"/>
                <path d="M25 55h14"/>
                <path d="M27 60h10"/>
                <path d="M32 2v6"/>
                <path d="M12 12l4 4"/>

            <img src="wrench-icon.svg?v=3" alt="" class="callout__wrench" />

        <ng-content></ng-content>
    </div>
</div>
